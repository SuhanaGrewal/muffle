model_name: ssl_wavlm_head
model_type: ssl_head

data:
  manifest_path: data/processed/asvspoof2019_la_manifest.csv
  sample_rate: 16000
  duration_seconds: 4.0

features:
  # base-plus (not large) to stay realistic on local CPU/MPS -- see README for the
  # large-model tradeoff if cloud compute becomes available later.
  ssl_model_name: microsoft/wavlm-base-plus

model:
  ssl_hidden_size: 768  # must match the SSL backbone's hidden size
  mlp_hidden: 128
  dropout: 0.1

train:
  batch_size: 8  # SSL forward passes are far heavier than LFCC; smaller batch than baseline
  num_workers: 4
  epochs: 15
