model_name: ssl_wavlm_head_v6
model_type: ssl_head

data:
  # Research-backed change of direction from v2-v5: instead of adding another new data
  # source (which kept teaching the small head a new shortcut each time -- see README),
  # this uses much more of what's already downloaded (ASVspoof2019 LA capped at 3000/group
  # instead of 800 -- full bonafide, 3.75x more spoof) plus RawBoost-style raw-waveform
  # augmentation (src/muffle/augment.py), which directly targets shortcut-learning by
  # randomizing channel/noise conditions so the model can't rely on incidental recording
  # artifacts. Literature-reported effect of RawBoost alone: 9.50%->5.31% EER on a
  # cross-condition ASVspoof benchmark (arxiv 2111.04433).
  manifest_path: data/processed/combined_manifest_v6.csv
  sample_rate: 16000
  duration_seconds: 4.0
  use_rawboost: true

features:
  ssl_model_name: microsoft/wavlm-base-plus

model:
  ssl_hidden_size: 768
  mlp_hidden: 128
  dropout: 0.1

train:
  batch_size: 8
  num_workers: 0
  epochs: 10
  lr: 0.0003
  weight_decay: 0.00001
  class_weights: [1.0, 1.0]  # [bonafide, spoof]
  device: auto
  checkpoint_dir: checkpoints/ssl_wavlm_head_v6
  seed: 0
