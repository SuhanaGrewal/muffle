model_name: ssl_wavlm_head_v4
model_type: ssl_head

data:
  # Same dataset-stratified subsampling as v3, now also including
  # mendeley_fake_audio (592 ElevenLabs+Respeecher clips, CC BY 4.0, Beltran &
  # Ballesteros L 2025, DOI 10.17632/79g59sp69z.1) -- adds contemporary TTS/voice-
  # conversion diversity beyond garystafford's 6 platforms. Spoof-only; does not
  # address the separate real-speaker-diversity gap (see README).
  manifest_path: data/processed/combined_manifest_small.csv
  sample_rate: 16000
  duration_seconds: 4.0

features:
  ssl_model_name: microsoft/wavlm-base-plus

model:
  ssl_hidden_size: 768
  mlp_hidden: 128
  dropout: 0.1

train:
  batch_size: 8
  num_workers: 0
  epochs: 10
  lr: 0.0003
  weight_decay: 0.00001
  class_weights: [1.0, 1.0]  # [bonafide, spoof]
  device: auto
  checkpoint_dir: checkpoints/ssl_wavlm_head_v4
  seed: 0
