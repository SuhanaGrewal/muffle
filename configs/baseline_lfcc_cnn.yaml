model_name: baseline_lfcc_cnn
model_type: cnn_baseline

data:
  manifest_path: data/processed/combined_manifest.csv
  sample_rate: 16000
  duration_seconds: 4.0

features:
  n_lfcc: 60
  n_filter: 128
  win_length_ms: 20.0
  hop_length_ms: 10.0

model:
  hidden_channels: [16, 32, 64]

train:
  batch_size: 32
  # num_workers>0 stalled badly here (macOS multiprocessing + MPS device interaction --
  # worker processes spun up but did almost no work over ~20 minutes). Single-process
  # loading is plenty fast for this model size, so not worth chasing the root cause.
  num_workers: 0
  epochs: 20
  lr: 0.0003
  weight_decay: 0.00001
  # ASVspoof2019 LA now dominates the combined train split by row count and is heavily
  # spoof-skewed (~7:1 spoof:bonafide across all three datasets combined), so weight
  # bonafide errors up accordingly.
  class_weights: [7.0, 1.0]  # [bonafide, spoof]
  device: auto  # auto -> mps if available, else cpu
  checkpoint_dir: checkpoints/baseline_lfcc_cnn
  seed: 0
