model_name: ssl_wavlm_head_v2
model_type: ssl_head

data:
  # Same subsampling approach as v1, but subsample_manifest now stratifies by dataset
  # too (not just split/label) -- so garystafford's ~745 train rows (6 modern TTS
  # platforms incl. 137 ElevenLabs) are fully included instead of being starved down to
  # ~23 by pure random sampling against ASVspoof2019 LA's much larger pool. See README.
  manifest_path: data/processed/combined_manifest_small.csv
  sample_rate: 16000
  duration_seconds: 4.0

features:
  ssl_model_name: microsoft/wavlm-base-plus

model:
  ssl_hidden_size: 768
  mlp_hidden: 128
  dropout: 0.1

train:
  batch_size: 8
  num_workers: 0
  epochs: 10
  lr: 0.0003
  weight_decay: 0.00001
  class_weights: [1.0, 1.0]  # [bonafide, spoof]
  device: auto
  checkpoint_dir: checkpoints/ssl_wavlm_head_v2
  seed: 0
