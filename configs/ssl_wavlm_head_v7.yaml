model_name: ssl_wavlm_head_v7
model_type: ssl_head

data:
  # Fixes a real bug in v6: growing ASVspoof2019 LA's volume (800->3000, all 2019-era
  # attack types A01-A06) without growing modern-generator volume alongside it diluted
  # garystafford+mendeley (ElevenLabs, Respeecher, and 4 other contemporary TTS/voice-
  # conversion platforms) from ~58% down to ~28% of the spoof training mix -- exactly
  # backwards for a detector that needs to catch modern high-quality voices, not just
  # old academic benchmark attacks. Fix: oversample modern-generator spoof rows 3x in
  # train (1169->3507), restoring their share to ~53%. RawBoost augmentation (still on)
  # gives each oversampled duplicate a fresh random distortion per epoch, so this isn't
  # literal repetition. See README.
  manifest_path: data/processed/combined_manifest_v7.csv
  sample_rate: 16000
  duration_seconds: 4.0
  use_rawboost: true

features:
  ssl_model_name: microsoft/wavlm-base-plus

model:
  ssl_hidden_size: 768
  mlp_hidden: 128
  dropout: 0.1

train:
  batch_size: 8
  num_workers: 0
  epochs: 10
  lr: 0.0003
  weight_decay: 0.00001
  class_weights: [1.0, 1.0]  # [bonafide, spoof]
  device: auto
  checkpoint_dir: checkpoints/ssl_wavlm_head_v7
  seed: 0
